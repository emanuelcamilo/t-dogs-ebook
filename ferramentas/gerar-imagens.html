<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Gerador de imagens · T Dogs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700&family=Grenze:wght@800;900&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 32px; background: #e9e9e9; font: 16px/1.5 "Schibsted Grotesk", system-ui, sans-serif; color: #141414; }
    h1 { font: 900 2rem/1 Grenze, serif; margin: 0 0 8px; }
    p { max-width: 70ch; }
    .grade { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; margin-top: 24px; }
    figure { margin: 0; background: #fff; padding: 16px; border-radius: 12px; }
    figure canvas { display: block; max-height: 420px; max-width: 100%; width: auto; height: auto; box-shadow: 0 1px 0 #ddd; }
    figcaption { margin-top: 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 14px; }
    a.baixar { color: #1D49A6; font-weight: 700; }
    #status { font-weight: 700; }
  </style>
</head>
<body>
  <h1>Imagens geradas do eBook</h1>
  <p>Esta página desenha a capa, a lombada e a contracapa usadas no livro 3D, a imagem de
  compartilhamento (Open Graph) e os ícones. Se mudar o título do eBook ou as cores, ajuste
  <code>ferramentas/gerar-imagens.js</code>, recarregue e baixe os arquivos para <code>assets/img/</code>.</p>
  <p id="status">Carregando fontes…</p>
  <div class="grade" id="grade"></div>
  <script type="module" src="gerar-imagens.js"></script>
</body>
</html>
